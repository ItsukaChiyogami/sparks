# ===========================================
# APPLICATION NAME
# ===========================================
spring.application.name=backend

# ===========================================
# SERVER CONFIGURATION
# ===========================================
server.port=8080

# ===========================================
# DATABASE CONFIGURATION (MySQL via Laragon)
# ===========================================
spring.datasource.url=jdbc:mysql://localhost:3306/sparks?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================================
# JPA / HIBERNATE CONFIGURATION
# ===========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===========================================
# JWT CONFIGURATION (WAJIB UNTUK LOGIN!)
# ===========================================
# ✅ SECRET YANG LEBIH PANJANG (MINIMAL 64 KARAKTER UNTUK HS512)
jwt.secret=ThisIsASuperSecretKeyThatIsLongEnoughForHS512AlgorithmAndMustBeAtLeast64CharactersLongForSecurity123456
jwt.expiration=86400000

# ===========================================
# LOGGING
# ===========================================
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ===========================================
# DISABLE SPRING SECURITY AUTO-CONFIGURATION ✅ BARU DITAMBAH
# ===========================================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration